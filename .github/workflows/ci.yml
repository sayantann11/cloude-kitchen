# Every push / pull request: type-check, unit tests, build, browser tests.
# Push to main: also deploy to Firebase Hosting (free) once the Firebase secret is added.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser tests (installed Chrome)
        run: npx playwright test
        env:
          PW_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Firebase not connected yet
        if: env.HAS_FIREBASE != 'true'
        run: echo "::notice::Skipping deploy. Add the FIREBASE_SERVICE_ACCOUNT secret (see README) to turn on auto-deploy."
      - uses: actions/checkout@v4
        if: env.HAS_FIREBASE == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_FIREBASE == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_FIREBASE == 'true'
      # Public web keys come from .env.production (they are not secrets).
      - run: npm run build
        if: env.HAS_FIREBASE == 'true'
      - name: Deploy site + security rules to Firebase
        if: env.HAS_FIREBASE == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only hosting,firestore:rules --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
