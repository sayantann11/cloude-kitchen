# Every push / pull request: type-check, unit tests, build, browser tests.
# Push to main: also deploy to Firebase Hosting (free) once the Firebase secret is added.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser tests (installed Chrome)
        run: npx playwright test
        env:
          PW_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Should we publish?
        run: |
          if [ "$HAS_FIREBASE" != "true" ]; then echo "::notice::Skipping deploy. Add the FIREBASE_SERVICE_ACCOUNT secret (see README)."; echo "GO=false" >> "$GITHUB_ENV";
          elif [ -f .site-down ]; then echo "::notice::Website is switched off (.site-down). Not publishing."; echo "GO=false" >> "$GITHUB_ENV";
          else echo "GO=true" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@v4
        if: env.GO == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.GO == 'true'
      # Public web keys come from .env.production (they are not secrets).
      - run: npm run build
        if: env.GO == 'true'
      - name: Deploy site + security rules to Firebase
        if: env.GO == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx firebase deploy --only firestore:rules --non-interactive > rules.log 2>&1; r=$?
          npx firebase deploy --only hosting --non-interactive > hosting.log 2>&1; h=$?
          rm -f "$RUNNER_TEMP/sa.json"
          cat rules.log hosting.log
          # Surface failures as annotations (visible without signing in to GitHub).
          [ $r -ne 0 ] && grep -iE "error|denied|permission|enable|not found|forbidden" rules.log | head -6 | sed 's/^/::error title=rules deploy::/'
          [ $h -ne 0 ] && grep -iE "error|denied|permission|enable|not found|forbidden" hosting.log | head -6 | sed 's/^/::error title=hosting deploy::/'
          exit $((r | h))
