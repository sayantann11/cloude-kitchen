# Switch the live website off while .site-down exists. Delete .site-down and push to publish it again
# (the normal "Test and deploy" workflow then redeploys).
name: Site on/off
on:
  push:
    branches: [main]
    paths: [.site-down, .github/workflows/site-down.yml]
jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Take the site offline
        if: hashFiles('.site-down') != ''
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 hosting:disable --force --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
          echo "::notice::Website is offline."
