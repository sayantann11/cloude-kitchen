<style>
/* Layout: app shell with a sticky top bar; customer side = one phone-width column, owner side = batches list + route panel side by side, stacked on phones. */
:root {
  --bg: #f3f5f1; --surface: #ffffff; --sunk: #e9ede6; --ink: #13201b; --muted: #5a6962; --line: #dbe1d8;
  --brand: #0d5c50; --brand-soft: #dcefe9; --on-brand: #ffffff;
  --accent: #c97d06; --accent-soft: #fbefd9;
  --veg: #1d8a3a; --nonveg: #b3261e; --good: #1d7a45; --good-soft: #def3e5; --warn: #a35f00; --warn-soft: #fcecd2; --crit: #b3261e;
  --map: #eaeee6; --river: #b9d7e6; --road: #cfd6cb; --mapink: #6b7a72;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --surface: #161f1c; --sunk: #1c2723; --ink: #e6ece8; --muted: #9aaaa2; --line: #2a3632;
  --brand: #46b8a2; --brand-soft: #173a33; --on-brand: #06211c;
  --accent: #f0a93a; --accent-soft: #3a2c12;
  --veg: #4cc06a; --nonveg: #f06a5f; --good: #5bd08a; --good-soft: #17352a; --warn: #f0b04a; --warn-soft: #3a2c12; --crit: #f06a5f;
  --map: #131b18; --river: #1c3a4b; --road: #2b3833; --mapink: #8d9c95; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #161f1c; --sunk: #1c2723; --ink: #e6ece8; --muted: #9aaaa2; --line: #2a3632;
  --brand: #46b8a2; --brand-soft: #173a33; --on-brand: #06211c;
  --accent: #f0a93a; --accent-soft: #3a2c12;
  --veg: #4cc06a; --nonveg: #f06a5f; --good: #5bd08a; --good-soft: #17352a; --warn: #f0b04a; --warn-soft: #3a2c12; --crit: #f06a5f;
  --map: #131b18; --river: #1c3a4b; --road: #2b3833; --mapink: #8d9c95; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }

button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar with a Sambalpuri bandha (ikat) strip */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bandha { height: 6px; background:
  conic-gradient(from 45deg at 50% 50%, var(--accent) 0 25%, transparent 0 50%, var(--accent) 0 75%, transparent 0) 0 0 / 12px 6px,
  var(--brand); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 18px; flex: none; }
.brand b { font-family: var(--f-display); font-size: 17px; display: block; line-height: 1.1; }

.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 13.5px; color: var(--muted); }

.demo-note { font-size: 12px; color: var(--muted); padding-block: 6px; border-bottom: 1px dashed var(--line); }

main { padding-block: 18px 110px; }

/* ---------- Customer ---------- */
.cust { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
.hello { display: grid; gap: 6px; }
.hello h1 { font-size: 26px; font-weight: 800; }
.chips-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--sunk); font-size: 12.5px; color: var(--muted); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.brand { background: var(--brand-soft); color: var(--brand); }
.cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cats button { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500; }
.cats button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.menu-sec { display: grid; gap: 10px; }

.stepper span { min-width: 18px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

.cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.cartbar button { width: 100%; max-width: 560px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; border: 0; background: var(--brand); color: var(--on-brand); padding: 14px 18px; border-radius: 14px; font-weight: 600; font-size: 15px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { font-size: 18px; }
.lines { display: grid; gap: 6px; font-size: 14px; }
.line { display: flex; justify-content: space-between; gap: 12px; }
.line.total { font-weight: 700; border-top: 1px solid var(--line); padding-top: 8px; }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
label.f span { font-weight: 400; color: var(--muted); }
input[type=text], input[type=tel], textarea, select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
textarea { resize: vertical; min-height: 64px; }
.pay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pay label { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; font-size: 14px; }

.btn { border: 0; background: var(--brand); color: var(--on-brand); padding: 13px 18px; border-radius: 12px; font-weight: 600; font-size: 15px; text-align: center; text-decoration: none; display: inline-flex; justify-content: center; align-items: center; gap: 8px; }

.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { border: 0; background: none; color: var(--brand); font-weight: 600; padding: 0; }

.mapbox { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--map); position: relative; }
.mapbox svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
.mapbox.pick svg { cursor: crosshair; }
.maphint { position: absolute; left: 8px; bottom: 8px; font-size: 11.5px; background: var(--surface); color: var(--muted); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding-bottom: 14px; position: relative; }
.steps li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); margin: 5px 0 0 3px; z-index: 1; }
.steps li::after { content: ""; position: absolute; left: 9px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.steps li:last-child::after { display: none; }
.steps li.done::before { background: var(--brand); border-color: var(--brand); }
.steps li.now::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

.steps small { color: var(--muted); font-size: 12.5px; }
.callout { background: var(--brand-soft); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; }

/* ---------- Owner ---------- */

.own-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; font-size: 13.5px; }
.controls label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.controls input[type=range] { width: 140px; accent-color: var(--brand); }
.controls .sp { flex: 1; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 12px; min-width: 0; }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-title h2 { font-size: 16px; }
.sec-title small { color: var(--muted); font-size: 12.5px; }
.batch { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; text-align: left; width: 100%; position: relative; }
.batch.multi { border-left: 4px solid var(--brand); }
.batch.solo { border-left: 4px solid var(--line); }
.batch[aria-current="true"] { box-shadow: 0 0 0 2px var(--brand); }
.batch-h { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.batch-h b { font-family: var(--f-display); font-size: 16px; }
.olist { display: grid; gap: 6px; }
.orow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; }
.orow > div { min-width: 0; }
.orow .n { width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.solo .orow .n { background: var(--muted); }
.orow .who { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orow .where { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.age { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.new-dot { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--on-brand); background: var(--accent); padding: 0 6px; border-radius: 5px; margin-left: 4px; vertical-align: 1px; }
.save { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; padding-top: 8px; border-top: 1px dashed var(--line); }
.save b { font-variant-numeric: tabular-nums; }
.save .good { color: var(--good); font-weight: 700; }
.bact { display: flex; gap: 8px; flex-wrap: wrap; }

.legs { display: grid; gap: 0; }
.leg { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.leg:last-child { border-bottom: 0; }
.leg .n { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.leg .n.k { background: var(--ink); color: var(--bg); }
.leg .n.r { background: var(--sunk); color: var(--muted); }
.leg b { font-size: 14px; }
.leg .addr { font-size: 12.5px; color: var(--muted); }
.leg .ph { font-size: 12.5px; }
.leg .t { text-align: right; font-size: 13px; white-space: nowrap; }
.leg .t small { display: block; color: var(--muted); font-size: 11.5px; }
.ok { color: var(--good); font-weight: 600; }
.late { color: var(--crit); font-weight: 600; }
.road-list { display: grid; gap: 8px; }
.road-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; font-size: 13.5px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 14px; }
textarea.copybox { font-family: var(--f-mono); font-size: 12px; }

@media (max-width: 860px) {
  .cols { grid-template-columns: minmax(0, 1fr); }

}
@media (max-width: 420px) {
  .seg button { padding: 7px 11px; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .batch, .add, .btn { transition: box-shadow .15s, transform .1s; }
  .btn:active, .add:active { transform: scale(.98); }
}

<script>
/* ======================= Data ======================= */
const MENU = [
  { cat: 'Odia specials', items: [

    { id: 'besara', n: 'Machha Besara', d: 'Rohu in mustard gravy, Odia home style', p: 220, v: false },
    { id: 'kassa', n: 'Chicken Kassa', d: 'Slow-cooked dry chicken, onion and whole spices', p: 240, v: false, tag: 'Spicy' },
    { id: 'mudhi', n: 'Mudhi Mansa', d: 'Mutton curry served with fresh puffed rice', p: 260, v: false },
    { id: 'santula', n: 'Santula', d: 'Light mixed-vegetable stew with milk and panch phutana', p: 110, v: true },
    { id: 'pakhala', n: 'Pakhala Bhata', d: 'Fermented water rice, badi chura, saga bhaja, fried potato', p: 140, v: true },
  ]},
  { cat: 'Thali', items: [
    { id: 'vthali', n: 'Odia Veg Thali', d: 'Rice, dal, santula, saga, bhaja, khata, papad', p: 180, v: true, tag: 'Lunch pick' },
    { id: 'fthali', n: 'Fish Thali', d: 'Veg thali with machha besara', p: 270, v: false },

  { cat: 'Snacks', items: [

    { id: 'dahibara', n: 'Dahibara Aloodum', d: 'Soft dahibara in curd, with spicy aloo dum', p: 60, v: true },
    { id: 'eggroll', n: 'Egg Roll', d: 'Paratha roll, double egg, onion, sauce', p: 70, v: false },
    { id: 'pakoda', n: 'Chicken Pakoda', d: 'Crispy boneless chicken fritters', p: 150, v: false },
  ]},
  { cat: 'Sweets', items: [
    { id: 'chhenapoda', n: 'Chhena Poda', d: 'Baked caramelised cottage cheese, 2 slices', p: 60, v: true, tag: 'Must try' },
    { id: 'rasabali', n: 'Rasabali (2 pcs)', d: 'Fried chhena discs in thickened sweet milk', p: 50, v: true },
    { id: 'kakara', n: 'Kakara Pitha (2 pcs)', d: 'Semolina pitha with coconut-jaggery filling', p: 45, v: true },
  ]},
  { cat: 'Drinks', items: [
    { id: 'lassi', n: 'Sweet Lassi', d: 'Thick curd lassi, 300 ml', p: 50, v: true },
    { id: 'soda', n: 'Masala Lemon Soda', d: '300 ml', p: 30, v: true },
  ]},
];
const ITEMS = Object.fromEntries(MENU.flatMap(c => c.items).map(i => [i.id, i]));

// Approximate locality centres, for the demo only
const PLACES = {
  'Ainthapali': [21.4895, 83.9940], 'Farm Road': [21.4815, 83.9870], 'Bareipali': [21.5010, 83.9850],
  'Khetrajpur': [21.4560, 83.9690], 'Budharaja': [21.4625, 83.9590], 'Dhanupali': [21.4600, 83.9930],
  'Golebazar': [21.4690, 83.9720], 'Sakhipara': [21.4745, 83.9665], 'Modipara': [21.4720, 83.9800],
  'Burla': [21.5050, 83.8730], 'Hirakud': [21.5190, 83.8880], 'Gopalmal': [21.4860, 83.9720],
};

/* ======================= Engine ======================= */
const KITCHEN = { name: 'Kitchen, Modipara', lat: 21.4712, lng: 83.9795 };
const ROAD_FACTOR = 1.35, SPEED_KMH = 20, HANDOVER_MIN = 3, PREP_MIN = 18, PROMISE_MIN = 50, NEAR_KM = 3.2, BEARING_MAX = 55;
function hav(a, b) {
  const R = 6371, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const road = (a, b) => hav(a, b) * ROAD_FACTOR;
const mins = km => km / SPEED_KMH * 60;
function bearing(a, b) {
  const r = Math.PI / 180, y = Math.sin((b.lng - a.lng) * r) * Math.cos(b.lat * r);
  const x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lng - a.lng) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}
const angDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const promiseFor = o => road(KITCHEN, o) > 8 ? 75 : PROMISE_MIN;
function perms(arr) {
  if (arr.length <= 1) return [arr.slice()];
  const out = [];
  arr.forEach((x, i) => perms(arr.slice(0, i).concat(arr.slice(i + 1))).forEach(p => out.push([x].concat(p))));
  return out;
}
function planRoute(orders, now) {
  const depart = Math.max(now, Math.max(...orders.map(o => o.placedAt + PREP_MIN)));
  let best = null;
  for (const p of perms(orders)) {
    let t = depart, km = 0, prev = KITCHEN, late = 0; const legs = [];
    for (const o of p) {
      const d = road(prev, o); km += d; t += mins(d);
      const promise = o.placedAt + promiseFor(o);
      late = Math.max(late, t - promise);
      legs.push({ order: o, km: d, eta: t, promise });
      t += HANDOVER_MIN; prev = o;
    }
    const back = road(prev, KITCHEN);
    const score = (late > 0 ? 1000 + late : 0) + km;
    if (!best || score < best.score) best = { stops: p, legs, km, backKm: back, totalKm: km + back, depart, late, returnAt: t + mins(back), score };
  }
  best.soloKm = orders.reduce((s, o) => s + 2 * road(KITCHEN, o), 0);
  best.savedKm = best.soloKm - best.totalKm;
  best.savedMin = mins(best.savedKm);
  best.onTime = best.late <= 0;
  return best;
}
function suggestBatches(orders, windowMin, maxSize, now) {
  const pending = orders.filter(o => o.status === 'cooking').sort((a, b) => a.placedAt - b.placedAt);
  const used = new Set(), groups = [];
  for (const seed of pending) {
    if (used.has(seed.id)) continue;
    const group = [seed]; used.add(seed.id);
    const why = '';
    const cands = pending.filter(c => !used.has(c.id) && c.placedAt - seed.placedAt <= windowMin).sort((a, b) => road(seed, a) - road(seed, b));
    for (const c of cands) {
      if (group.length >= maxSize) break;
      const near = Math.min(...group.map(g => road(g, c)));
      const sameWay = angDiff(bearing(KITCHEN, seed), bearing(KITCHEN, c)) <= BEARING_MAX;
      if (near > NEAR_KM || !sameWay) continue;
      const trial = planRoute(group.concat(c), now);
      if (!trial.onTime) continue;
      if (trial.savedKm <= 0.3) continue;
      group.push(c); used.add(c.id);
    }
    groups.push({ orders: group, route: planRoute(group, now), why });
  }
  // Explain why a single order rides alone
  for (const g of groups) {
    if (g.orders.length > 1) continue;
    const s = g.orders[0];
    if (road(KITCHEN, s) > 8) { g.why = 'Outer zone, more than 8 km away'; continue; }
    const near = pending.filter(c => c.id !== s.id && road(s, c) <= NEAR_KM && angDiff(bearing(KITCHEN, s), bearing(KITCHEN, c)) <= BEARING_MAX)
      .sort((a, b) => road(s, a) - road(s, b));
    if (!near.length) { g.why = 'No other order nearby in this window'; continue; }
    const c = near[0], cg = groups.find(x => x.orders.includes(c));
    if (Math.abs(c.placedAt - s.placedAt) > windowMin) { g.why = `Nearest order (${c.place}) is more than ${windowMin} min apart`; continue; }
    if (cg.orders.length >= maxSize) { g.why = `The ${c.place} trip is already full`; continue; }
    const trial = planRoute(cg.orders.concat(s), now), bad = trial.legs.find(l => l.eta > l.promise);
    g.why = bad ? `Joining the ${c.place} trip would make ${bad.order.name.split(' ')[0]}'s food late` : 'Grouping saves almost no distance';
  }
  return groups;
}

function mapSVG({ pts = [], path = null, fit = null, pick = false, pin = null }) {

    let w = Math.max(x1 - x0, 90) + 110, h = Math.max(y1 - y0, 60) + 70;

  }
  if (pin) {
    const x = X(pin.lng), y = Y(pin.lat), z = r * 1.6;
    s += `<g><path d="M${x} ${y} c ${-z} ${-z * 1.4}, ${-z} ${-z * 2.6}, 0 ${-z * 2.6} s ${z} ${z * 1.2}, 0 ${z * 2.6}z" fill="var(--accent)" stroke="var(--surface)" stroke-width="${r * .25}"/><circle cx="${x}" cy="${y - z * 1.75}" r="${z * .35}" fill="var(--surface)"/></g>`;

const key = g => g.orders.map(o => o.id).join('-');
function batchCard(g) {
  const r = g.route, many = g.orders.length > 1, now = nowMin();
  const label = many ? `${g.orders.length} orders, one trip` : 'Single order';
  const areas = [...new Set(r.stops.map(o => o.place))].join(', ');
  return `<div class="batch ${many ? 'multi' : 'solo'}" aria-current="${key(g) === S.sel}">
    <div class="batch-h"><b>${label}</b>${many ? `<span class="chip good">Saves ${km1(r.savedKm)} km · ~${Math.round(r.savedMin)} min</span>` : `<span class="chip">${esc(g.why)}</span>`}</div>
    <div class="muted" style="font-size:12.5px;margin-top:-6px">${esc(areas)}</div>
    <div class="olist">${r.stops.map((o, i) => `<div class="orow"><span class="n">${i + 1}</span><div><div class="who">${esc(o.name)}${now - o.placedAt < 3 ? '<span class="new-dot">NEW</span>' : ''}</div><div class="where">${esc(itemsText(o.items))}</div></div><span class="age">${ago(o.placedAt)}<br>via ${esc(o.from)}</span></div>`).join('')}</div>
    <div class="save"><span>Leaves <b>${clock(r.depart)}</b></span><span>Route <b>${km1(r.totalKm)} km</b></span>${many ? `<span>Separate trips <b>${km1(r.soloKm)} km</b></span>` : ''}<span class="${r.onTime ? 'ok' : 'late'}">${r.onTime ? 'Everyone on time' : `Late by ${Math.ceil(r.late)} min`}</span></div>
    <div class="bact"><button class="btn small ${key(g) === S.sel ? '' : 'ghost'}" type="button" data-sel="${key(g)}">${key(g) === S.sel ? 'Showing route' : 'View route'}</button><button class="btn small ghost" type="button" data-dispatch="${key(g)}">${many ? 'Send together' : 'Send now'}</button></div>
  </div>`;
}
function routePanel(g) {
  const r = g.route;
  const path = [KITCHEN, ...r.stops, KITCHEN];
  const pts = r.stops.map((o, i) => ({ ...o, label: String(i + 1), name: o.name.split(' ')[0] }));
  return `<div class="card">
    <div class="sec-title"><h2>Best route · ${r.stops.length} stop${r.stops.length > 1 ? 's' : ''}</h2><small>${km1(r.totalKm)} km incl. return</small></div>
    <div class="mapbox">${mapSVG({ pts, path, fit: [KITCHEN, ...r.stops] })}<span class="maphint">Schematic · road distance estimated</span></div>
    <div class="legs">
      <div class="leg"><span class="n k">K</span><div><b>Leave kitchen</b><div class="addr">${esc(KITCHEN.name)} · food packed</div></div><div class="t num">${clock(r.depart)}</div></div>
      ${r.legs.map((l, i) => { const o = l.order, ok = l.eta <= l.promise; return `<div class="leg"><span class="n">${i + 1}</span><div><b>${esc(o.name)}</b> <span class="muted" style="font-size:12.5px">#${o.id}</span>
        <div class="addr">${esc(o.landmark)}</div>
        <div class="ph">${esc(o.phone)} · ${rs(orderValue(o.items))} ${esc(o.pay === 'Cash on delivery' ? 'cash' : 'UPI')} · <a class="link" href="${pinLink(o)}" target="_blank" rel="noopener">pin</a></div></div>
        <div class="t"><span class="num">${clock(l.eta)}</span><small>${km1(l.km)} km</small><small class="${ok ? 'ok' : 'late'}">${ok ? 'on time' : 'late'} · by ${clock(l.promise)}</small></div></div>`; }).join('')}
      <div class="leg"><span class="n r">↩</span><div><b>Back to kitchen</b><div class="addr">${km1(r.backKm)} km</div></div><div class="t num">${clock(r.returnAt)}</div></div>
    </div>
    <div style="display:grid;gap:8px;grid-template-columns:1fr 1fr">
      <a class="btn" href="${gmaps(r.stops)}" target="_blank" rel="noopener">Open in Google Maps</a>
      <button class="btn ghost" type="button" id="copyrider">Copy for rider</button>
    </div>
    <textarea class="copybox" id="ridertext" rows="5" hidden readonly>${esc(riderText(r))}</textarea>
  </div>`;
}
function riderText(r) {
  return `Trip from ${KITCHEN.name}, leave ${clock(r.depart)}\n` + r.legs.map((l, i) => {
    const o = l.order; return `${i + 1}. ${o.name} (${o.phone}) - ${o.landmark}. Collect ${o.pay === 'Cash on delivery' ? 'cash ' + rs(orderValue(o.items)) : 'UPI'}. Pin: ${pinLink(o)}`;
  }).join('\n') + `\nFull route: ${gmaps(r.stops)}`;
}

/* ======================= Render + events ======================= */
function render() {
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === S.mode));
  $('#app').innerHTML = S.mode === 'customer' ? renderCustomer() : renderOwner();
  const n = cartCount();
  $('#cartbar').innerHTML = S.mode === 'customer' && S.step === 'menu' && n ? `<div class="cartbar"><button type="button" data-step="checkout"><span>${n} item${n > 1 ? 's' : ''} · ${rs(cartTotal())}</span><span>Checkout →</span></button></div>` : '';
}
function setMode(m) { S.mode = m; if (location.hash !== '#' + m) history.replaceState(null, '', '#' + m); render(); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const t = e.target.closest('button, a, svg#pickmap'); if (!t) return;
  const d = t.dataset || {};
  if (t.id === 'pickmap') {
    const pt = t.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(t.getScreenCTM().inverse());
    const land = $('#c-land').value, nm = $('#c-name').value, ph = $('#c-phone').value, pay = document.querySelector('input[name=pay]:checked').value;
    S.pin = toLL(p.x, p.y); render();
    $('#c-land').value = land; $('#c-name').value = nm; $('#c-phone').value = ph; document.querySelector(`input[name=pay][value="${pay}"]`).checked = true;
    return;
  }
  if (d.mode) return setMode(d.mode);
  if (d.goto) return setMode(d.goto);
  if (d.cat) { S.cat = d.cat; return render(); }
  if (d.inc) { S.cart[d.inc] = (S.cart[d.inc] || 0) + 1; return render(); }
  if (d.dec) { S.cart[d.dec]--; if (!S.cart[d.dec]) delete S.cart[d.dec]; return render(); }
  if (d.step) { S.step = d.step; render(); return window.scrollTo(0, 0); }
  if (t.id === 'place') {
    const name = $('#c-name').value.trim() || 'Customer', land = $('#c-land').value.trim() || 'No landmark given';
    const o = { id: ++seq, name, place: nearestPlace(S.pin), lat: S.pin.lat, lng: S.pin.lng, placedAt: nowMin(), status: 'cooking', items: { ...S.cart }, phone: $('#c-phone').value, landmark: land, from: 'App', pay: document.querySelector('input[name=pay]:checked').value };
    S.orders.push(o); S.myOrder = o.id; S.cart = {}; S.step = 'track'; render(); window.scrollTo(0, 0);
    return toast('Order placed. The kitchen can see it now.');
  }
  if (d.sel) { S.sel = d.sel; render(); if (matchMedia('(max-width: 860px)').matches) $('#routepanel').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (d.dispatch) {
    const g = suggestBatches(S.orders, S.windowMin, S.maxSize, nowMin()).find(x => key(x) === d.dispatch); if (!g) return;
    g.orders.forEach(o => o.status = 'out'); S.trips.push(g); S.savedTodayKm += g.route.savedKm; S.sel = null; render();
    return toast(g.orders.length > 1 ? `${g.orders.length} orders sent with one rider` : 'Order sent');
  }
  if (d.deliver !== undefined) {
    const tr = S.trips.splice(Number(d.deliver), 1)[0]; tr.orders.forEach(o => o.status = 'delivered'); render();
    return toast('Trip marked delivered');
  }
  if (t.id === 'addtest') {
    const names = ['Sunita Pradhan', 'Bikash Rout', 'Lipsa Mishra', 'Amit Sahu', 'Rashmi Behera', 'Pradeep Kar', 'Sasmita Das'];
    const places = ['Ainthapali', 'Farm Road', 'Dhanupali', 'Golebazar', 'Sakhipara', 'Khetrajpur', 'Gopalmal', 'Budharaja', 'Bareipali'];
    const ids = Object.keys(ITEMS), pick = a => a[Math.floor(Math.random() * a.length)];
    const o = mkOrder(pick(names), pick(places), 0, { [pick(ids)]: 1, [pick(ids)]: 1 }, '9' + Math.floor(1e3 + Math.random() * 8999) + ' 0xx' + Math.floor(10 + Math.random() * 89), 'Test order, landmark to be confirmed on call', pick(['App', 'Phone', 'WhatsApp']));
    S.orders.push(o); S.sel = null; render(); return toast(`New order from ${o.name}, ${o.place}`);
  }
  if (t.id === 'copyrider') {
    const ta = $('#ridertext'), txt = ta.value;
    navigator.clipboard?.writeText(txt).then(() => toast('Copied. Paste it into WhatsApp for the rider.'))
      .catch(() => { ta.hidden = false; ta.focus(); ta.select(); toast('Select all and copy the text below'); });
    if (!navigator.clipboard) { ta.hidden = false; ta.select(); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'win') { S.windowMin = Number(e.target.value); S.sel = null; render(); $('#win')?.focus(); }
});
document.addEventListener('change', e => { if (e.target.id === 'max') { S.maxSize = Number(e.target.value); S.sel = null; render(); } });
function fromHash() { const h = location.hash.slice(1); if (h === 'owner' || h === 'customer') { S.mode = h; } render(); }
window.addEventListener('hashchange', fromHash);
// Start with a sample cart so the checkout is one tap away
S.cart = { vthali: 1, chhenapoda: 2 };
fromHash();
setInterval(() => { if (S.mode === 'owner' || S.step === 'track') { const y = scrollY; render(); scrollTo(0, y); } }, 30000);
</script>
